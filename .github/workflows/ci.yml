name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Backend tests
        run: npm test
        working-directory: backend
      - name: Backend concurrency integration test
        run: npm run test:integration
        working-directory: backend
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/url-shortener-test
      - name: Backend syntax checks
        shell: bash
        run: |
          for file in backend/**/*.js; do node --check "$file"; done
      - name: Frontend tests
        run: npm test
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend build
        run: npm run build
        working-directory: frontend
      - name: Dependency audit (report)
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true
