version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: shortly-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: url-shortener
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortly-net

  redis:
    image: redis:7.2-alpine
    container_name: shortly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortly-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortly-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/url-shortener
      REDIS_URL: redis://redis:6379
      JWT_SECRET: please-change-this-jwt-secret-in-production-min32chars
      CSRF_SECRET: please-change-this-csrf-secret-in-production-min32chars
      CORS_ORIGIN: http://localhost:80,http://localhost:5173
      PUBLIC_API_URL: http://localhost:5000
      TRUST_PROXY_HOPS: 1
      REQUIRE_UPLOAD_SCAN: "false"
    volumes:
      - uploads-data:/app/private-uploads
    networks:
      - shortly-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shortly-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - shortly-net

networks:
  shortly-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  uploads-data:
